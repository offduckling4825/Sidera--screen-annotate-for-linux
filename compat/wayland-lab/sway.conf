# Deliberately standalone: do not import GNOME's or the user's Sway configuration.
font pango:Sans 12
default_border none
output * bg #e8edf4 solid_color
output * mode 1280x800
seat seat0 fallback true
xwayland enable
bindsym Ctrl+Shift+Escape exit
bindsym Ctrl+Shift+d exec sidera --toggle
exec python3 /usr/local/share/sidera-wayland-lab/panel.py
