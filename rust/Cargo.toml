[package]
name = "sidera"
version = "3.0.0"
edition = "2021"
description = "Sidera - screen annotation overlay (pure Rust, X11, no Qt)"
license = "GPL-3.0-only"

[[bin]]
name = "sidera"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", features = ["shape", "xtest", "randr", "xinput"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.13"
calloop-wayland-source = "0.3"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
evdev = "0.13.2"
arboard = "3"
zbus = "4"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
