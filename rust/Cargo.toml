[package]
name = "sidera"
version = "0.1.0"
edition = "2021"
description = "Sidera - screen annotation overlay (pure Rust, X11, no Qt)"
license = "GPL-3.0-only"

[[bin]]
name = "sidera"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", features = ["shape", "xtest", "randr", "xinput"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
