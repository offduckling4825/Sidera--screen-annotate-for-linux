name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wps-addin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install WPS installer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 bubblewrap

      - name: Test WPS add-in registration
        run: python3 wps-addin/tests/test_install.py

      - name: Verify WPS add-in startup and state sync
        run: |
          node --check wps-addin/main.js
          node --check wps-addin/js/bridge.js
          node --test wps-addin/tests/bridge.test.cjs wps-addin/tests/state-sync.test.cjs

  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            python3 bubblewrap \
            qtbase5-dev \
            libqt5widgets5 \
            libqt5network5 \
            libx11-dev \
            libxcb1-dev \
            libxext-dev \
            libxtst-dev

      - name: Test C++ bridge lifecycle
        working-directory: cpp
        run: make test-lifecycle

      - name: Compile Sidera
        working-directory: cpp
        run: |
          make -j$(nproc)

      - name: Verify build artifact
        working-directory: cpp
        run: |
          test -f annotate_amd64
          echo "annotate_amd64 built successfully."

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install startup test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 bubblewrap xvfb

      - name: Test DEB packaging architecture checks
        run: python3 rust/tests/test_build_deb.py

      - name: Ensure clippy
        run: rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        working-directory: rust
        run: cargo build --release --locked

      - name: Test
        working-directory: rust
        run: cargo test --locked

      - name: Test startup diagnostics and backend selection
        run: python3 rust/tests/test_startup.py rust/target/release/sidera

      - name: Test X11 touch and input regions
        working-directory: rust
        run: xvfb-run -a cargo test --locked x11:: -- --ignored --test-threads=1

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked

      - name: Verify build artifact
        working-directory: rust
        run: |
          test -f target/release/sidera
          echo "sidera (rust) built successfully."
